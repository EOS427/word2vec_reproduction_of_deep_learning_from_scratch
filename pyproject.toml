[tool.word2vec_package]
win_size = 5
hid_size = 100
batch_size = 100
max_epoch = 10

[tool.processor]
GPU=true


[project]
name = "word2vec-package"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "fonttools==4.68.0",
    "kiwisolver==1.5.1",
    "lxml==6.1.3",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "packaging==26.3",
    "pillow==13.0.0",
    "pyparsing==3.3.3",
    "python-dateutil==4.0.0",
    "python-docx==1.2.0",
    "requests>=2.34.2",
    "typing-extensions==4.16.0",
    "tzdata==2026.6",
]
